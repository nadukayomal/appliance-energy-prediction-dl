project:
  name: "appliance-energy-prediction"
  version: "0.1.0"
  description: "Multivariate time-series prediction of appliance energy consumption using deep learning"
  owner: "data-science-team"
  environment: "development"

paths:
  root_dir: "."
  data:
    raw: "data/raw/energy_data_set.csv"
    processed_dir: "data/processed"
    cleaned: "data/processed/cleaned_data.csv"
    featured: "data/processed/featured_data.csv"
    scaled: "data/processed/scaled_data.csv"
    splits:
      train: "data/processed/train.csv"
      test: "data/processed/test.csv"
      X_train: "data/processed/X_train.npy"
      X_test: "data/processed/X_test.npy"
      y_train: "data/processed/y_train.npy"
      y_test: "data/processed/y_test.npy"
  artifacts:
    root: "artifacts"
    figures: "artifacts/figures"
    reports: "artifacts/reports"
    models: "artifacts/models"
    metrics: "artifacts/metrics"
    logs: "artifacts/logs"
    scalers: "artifacts/scalers"
  model:
    baseline_model: "artifacts/models/baseline_model.joblib"
    lstm_model: "artifacts/models/lstm_model.h5"
    best_model: "artifacts/models/best_model.h5"

columns:
  target: "Appliances"
  datetime: "date"
  drop_columns:
    - "rv1"
    - "rv2"
  energy_features:
    - "lights"
  temperature_features:
    - "T1"
    - "T2"
    - "T3"
    - "T4"
    - "T5"
    - "T6"
    - "T7"
    - "T8"
    - "T9"
    - "T_out"
  humidity_features:
    - "RH_1"
    - "RH_2"
    - "RH_3"
    - "RH_4"
    - "RH_5"
    - "RH_6"
    - "RH_7"
    - "RH_8"
    - "RH_9"
    - "RH_out"
  weather_features:
    - "Press_mm_hg"
    - "Windspeed"
    - "Visibility"
    - "Tdewpoint"
  time_features:
    - "hour"
    - "day_of_week"
    - "month"
    - "is_weekend"
    - "NSM"

preprocessing:
  missing_values:
    strategy: "interpolate"          # linear interpolation recommended for time series
    enabled: true
  outliers:
    method: "iqr"                    # or "zscore"
    threshold: 3.0
    action: "clip"                   # options: "remove", "clip", "impute"
    enabled: true
  scaling:
    method: "minmax"                 # or "standard"
    enabled: true
  datetime_features:
    enabled: true
    extract:
      - "hour"
      - "day_of_week"
      - "month"
      - "is_weekend"
      - "NSM"
  feature_engineering:
    enabled: true
    lagged_features:
      enabled: true
      lags: [1, 3, 6, 12]             # 10min, 30min, 1hr, 2hr
      columns: ["Appliances"]
    rolling_features:
      enabled: true
      windows: [6, 12, 24]            # 1hr, 2hr, 4hr
      statistics: ["mean", "std", "min", "max"]
      columns: ["Appliances", "T_out", "RH_out"]
    interaction_features:
      enabled: false
  drop_columns:
    - "rv1"
    - "rv2"
  split:
    method: "temporal"               # important for time series
    test_size: 0.2
    shuffle: false

modeling:
  random_state: 42
  test_size: 0.2
  sequence_length: 24                # lookback window (e.g. 4 hours)
  forecast_horizon: 1                # predict next step
  baseline_models:
    - "linear_regression"
    - "random_forest"
    - "xgboost"
  deep_learning:
    architectures:
      - "lstm"
      - "gru"
      # - "cnn_lstm"
    lstm:
      units: [64, 32]
      dropout: 0.2
      recurrent_dropout: 0.1
      activation: "tanh"
      dense_units: 16
    gru:
      units: [64, 32]
      dropout: 0.2
      activation: "tanh"
    optimizer: "adam"
    learning_rate: 0.001
    loss: "mse"
    metrics: ["mae", "mse"]
    batch_size: 64
    epochs: 50
    early_stopping:
      enabled: true
      patience: 10
      restore_best_weights: true
    reduce_lr:
      enabled: true
      factor: 0.5
      patience: 5

training:
  use_pipeline: true
  validation_split: 0.15
  hyperparameter_tuning:
    enabled: true
    method: "random_search"          # or "grid_search", "optuna"
    n_iter: 15
    param_grid:
      learning_rate: [0.001, 0.0005, 0.0001]
      batch_size: [32, 64, 128]
      units: [[64, 32], [128, 64], [64]]
      dropout: [0.1, 0.2, 0.3]

evaluation:
  metrics:
    - "mae"
    - "rmse"
    - "mape"
    - "r2"
  visualization:
    predicted_vs_actual: true
    residual_plot: true
    loss_curve: true
    feature_importance: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "artifacts/logs/training.log"

reproducibility:
  random_state: 42
  numpy_seed: 42
  tensorflow_seed: 42
  python_hash_seed: 42