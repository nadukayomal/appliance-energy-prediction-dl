[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appliance-energy-prediction"
version = "0.1.0"
description = "End-to-end machine learning and deep learning pipeline for appliance energy forecasting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Naduka Yomal", email = "your-email@example.com" }]

dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "scikit-learn>=1.4,<2.0",
    "torch>=2.2,<3.0",
    "torchmetrics>=1.3,<2.0",
    "statsmodels>=0.14,<1.0",
    "scipy>=1.12,<2.0",
    "joblib>=1.3,<2.0",
    "tqdm>=4.66,<5.0",
    "xgboost>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.3,<1.0",
    "mypy>=1.9,<2.0",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[project.scripts]
run-data-pipeline = "pipeline.data_pipeline:main"
run-training-pipeline = "pipeline.training_pipeline:main"
run-inference-pipeline = "pipeline.inference_pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "pipeline*", "utils*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov=pipeline --cov-report=term-missing -v"
